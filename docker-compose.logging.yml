# =============================================================================
# PharmaFlow — Logging Stack (standalone, no RabbitMQ image)
# =============================================================================
#
# PURPOSE: Spin up ONLY Loki + Grafana + logging-service.
#          RabbitMQ is already running locally — the logging-service
#          connects to it via host.docker.internal (Docker Desktop for Windows).
#
# HOW TO USE:
#   docker compose -f docker-compose.logging.yml up -d --build
#   docker compose -f docker-compose.logging.yml logs -f logging-service
#   docker compose -f docker-compose.logging.yml down -v
#
# PORTS on host:
#   3100   Loki HTTP API
#   3001   Grafana UI → http://localhost:3001  (admin / admin)
#          NOTE: mapped to 3001 to avoid clash with api-gw on 3000
#
# AFTER IT STARTS — wire up Grafana:
#   1. Open http://localhost:3001  →  admin / admin
#   2. Connections → Data Sources → Add → Loki
#      URL: http://loki:3100  →  Save & Test
#   3. Explore → Loki data source → query: {service="order-service"}
#
# ENV VARS you can tune (set in logging-service environment below):
#   BATCH_SIZE        — flush after N messages   (default: 50)
#   FLUSH_INTERVAL_MS — flush every N ms         (default: 2000)
#
# =============================================================================

name: pharmaflow-logging

volumes:
  loki_data:
  grafana_data:

networks:
  logging:
    driver: bridge

services:

  # ── Loki ── log storage + query engine ────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: pharmaflow-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Grafana ── visualisation UI ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: pharmaflow-grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000" # host:container — 3001 avoids clash with api-gw on 3000
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - logging

  # ── logging-service ── RabbitMQ consumer → Loki ───────────────────────────
  # Connects to your LOCAL RabbitMQ via host.docker.internal (Docker Desktop)
  logging-service:
    build:
      context: ./logging-service
      dockerfile: Dockerfile
    container_name: pharmaflow-logging-service
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      # host.docker.internal resolves to your Windows host from inside the container
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672
      LOKI_URL: http://loki:3100
      BATCH_SIZE: 50
      FLUSH_INTERVAL_MS: 2000
    networks:
      - logging
    # Required on Linux hosts (no-op on Docker Desktop for Windows/Mac)
    extra_hosts:
      - "host.docker.internal:host-gateway"
